kind = "web"
previewPath = "/"
title = "SBM-Pranav Landing Page"
version = "1.0.0"
id = "artifacts/sbm-pranav"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24708

[services.development]
run = "pnpm --filter @workspace/sbm-pranav run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sbm-pranav", "run", "build" ]
publicDir = "artifacts/sbm-pranav/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24708"
BASE_PATH = "/"
